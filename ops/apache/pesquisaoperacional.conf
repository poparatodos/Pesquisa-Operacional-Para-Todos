# Configuração do Apache para o site Pesquisa Operacional Para Todos.
#
# Por que: o apache2.conf do Ubuntu vem com `AllowOverride None` em /var/www/,
# então o Apache IGNORA o .htaccess que o build publica (website/public/.htaccess).
# Sem ele, as URLs limpas (/po1/aula-5) não acham o .html pré-renderizado e a
# página 404 própria não é usada. Este bloco libera só o necessário para o
# .htaccess funcionar; as regras em si continuam versionadas no repositório.
#
# Instalação (uma vez, no servidor):
#   sudo cp pesquisaoperacional.conf /etc/apache2/conf-available/
#   sudo a2enmod rewrite
#   sudo a2enconf pesquisaoperacional
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Para desfazer: sudo a2disconf pesquisaoperacional && sudo systemctl reload apache2

<Directory /var/www/html>
    # FileInfo: permite RewriteEngine/RewriteRule e ErrorDocument no .htaccess.
    AllowOverride FileInfo
    # -Indexes: nunca listar o conteúdo de uma pasta (ex.: /materiais/).
    # -MultiViews: impede o Apache de "adivinhar" po1 -> po1.html por conta
    #  própria, deixando a resolução de URL só para as regras do .htaccess.
    Options -Indexes -MultiViews +FollowSymLinks
    # /po1 é ao mesmo tempo po1.html (catálogo) e a pasta po1/ (aulas). Com o
    # padrão (On), o mod_dir responde 301 -> /po1/ antes do .htaccess agir, e a
    # URL canônica do SEO (/po1, sem barra) nunca seria servida diretamente.
    DirectorySlash Off
</Directory>
