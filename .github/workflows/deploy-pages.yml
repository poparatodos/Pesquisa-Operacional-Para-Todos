name: Deploy Pages
on:
  push:
    branches: [main]
  # Homologação: permite disparar manualmente a partir de qualquer branch
  # (ex.: vue-refactor) pela aba Actions do GitHub.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: website/package-lock.json }
      - run: npm ci
      - run: npm run test
      - run: npm run validate:content
      # SPA fallback (deep links no Pages): o script postbuild do package.json
      # já copia dist/index.html -> dist/404.html durante o build.
      - run: npm run build
        env:
          VITE_BASE: /Pesquisa-Operacional-Para-Todos/
      # Gate de SEO (ticket 08): roda SOBRE o dist/ recém-gerado, ANTES de
      # publicar. (1) dist-scan: title único/description/canonical por rota;
      # falha o CI com código ≠ 0 se qualquer rota regredir.
      - run: npm run seo:gate
      # (2) Lighthouse CI: audita o dist/ (staticDistDir) e falha se a categoria
      # SEO < 100. O runner ubuntu-latest já traz Chrome; chromeFlags em
      # lighthouserc.json usam --no-sandbox --headless=new para o ambiente de CI.
      - run: npm run seo:lighthouse
      - uses: actions/upload-pages-artifact@v3
        with: { path: website/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
