# Gate de PRODUÇÃO — servidor Apache da UNIRIO (https://pesquisaoperacional.uniriotec.br)
#
# Quem PUBLICA é o próprio servidor: o ops/deploy-servidor.sh roda no cron à
# 00:00, puxa a main e, se houver commit novo, refaz testes + build + gate de
# SEO e sincroniza o dist/ no DocumentRoot. O antigo job de rsync/SSH daqui
# foi removido porque o GitHub Actions não alcança o servidor (SSH bloqueado
# fora da rede da UNIRIO; o ssh-keyscan falhava em todo push).
#
# Este workflow continua rodando em cada push para a main como aviso
# antecipado: se ficar vermelho, o deploy da meia-noite também vai falhar
# (e o site segue na versão anterior).
#
# Independente do deploy-pages.yml (homologação no GitHub Pages com
# VITE_BASE=/Pesquisa-Operacional-Para-Todos/). Aqui a base é '/' porque o site
# roda na raiz do domínio próprio.
name: Gate Prod
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: website/package-lock.json }
      - run: npm ci
      - run: npm run test
      # Produção usa base '/' (domínio próprio na raiz), ao contrário da
      # homologação no Pages que usa /Pesquisa-Operacional-Para-Todos/.
      - run: npm run build
        env:
          VITE_BASE: /
      # Gate de SEO (ticket 08): roda SOBRE o dist/ recém-gerado, ANTES de
      # chegar ao servidor. dist-scan (title/description/canonical por rota) + Lighthouse
      # (categoria SEO); qualquer regressão deixa o CI vermelho.
      - run: npm run seo:gate
      - run: npm run seo:lighthouse
